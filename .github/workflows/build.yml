name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # commit the built app into the App folder (and publish version releases)
  actions: write   # delete old build artifacts (they use the account's Actions storage)

# A newer push to the same branch cancels the build still running for the previous one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  EMBREE_VERSION: "4.3.3"
  OIDN_VERSION: "2.3.3"
  QT_VERSION: "6.8.3"
  PYTHON_VERSION: "3.12"
  # Embeddable Python shipped next to Veraa.exe (same 3.12 ABI as the build-time Python).
  PYTHON_EMBED_VERSION: "3.12.10"

jobs:
  windows:
    name: Windows x64 (Veraa.exe)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Python (scripting)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Embree and Open Image Denoise
        run: |
          $deps = Join-Path $env:RUNNER_TEMP "deps"
          New-Item -ItemType Directory -Force $deps | Out-Null
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest "https://github.com/RenderKit/embree/releases/download/v$env:EMBREE_VERSION/embree-$env:EMBREE_VERSION.x64.windows.zip" -OutFile "$deps/embree.zip"
          Expand-Archive "$deps/embree.zip" -DestinationPath "$deps/embree"
          Invoke-WebRequest "https://github.com/RenderKit/oidn/releases/download/v$env:OIDN_VERSION/oidn-$env:OIDN_VERSION.x64.windows.zip" -OutFile "$deps/oidn.zip"
          Expand-Archive "$deps/oidn.zip" -DestinationPath $deps
          "EMBREE_ROOT=$deps/embree" >> $env:GITHUB_ENV
          "OIDN_ROOT=$deps/oidn-$env:OIDN_VERSION.x64.windows" >> $env:GITHUB_ENV

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -Dembree_DIR="$env:EMBREE_ROOT/lib/cmake/embree-$env:EMBREE_VERSION"
          -DOpenImageDenoise_DIR="$env:OIDN_ROOT/lib/cmake/OpenImageDenoise-$env:OIDN_VERSION"
          -DPython3_ROOT_DIR="$env:pythonLocation"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Copy runtime libraries next to the executables
        run: |
          $bin = "build/bin/Release"
          Copy-Item "$env:EMBREE_ROOT/bin/embree4.dll", "$env:EMBREE_ROOT/bin/tbbmalloc.dll" $bin
          # Denoiser: CPU device plus the CUDA and HIP GPU devices (used when a matching GPU
          # driver is present; otherwise the CPU device is used). The SYCL device is left out.
          foreach ($dll in "OpenImageDenoise.dll", "OpenImageDenoise_core.dll", "OpenImageDenoise_device_cpu.dll",
                           "OpenImageDenoise_device_cuda.dll", "OpenImageDenoise_device_hip.dll", "tbb12.dll") {
            Copy-Item "$env:OIDN_ROOT/bin/$dll" $bin
          }

      # A failing test doesn't hold back the App folder; the last step fails the job instead.
      - name: Test
        id: test
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        id: package
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist/Veraa"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Get-ChildItem build/bin/Release -File |
            Where-Object { $_.Extension -in ".exe", ".dll" -and $_.BaseName -notlike "*_tests" } |
            Copy-Item -Destination $dist
          foreach ($exe in "Veraa.exe", "veraa-render.exe") {
            if (-not (Test-Path "$dist/$exe")) { throw "$exe was not built" }
          }
          windeployqt --release --no-translations --no-system-d3d-compiler "$dist/Veraa.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          # Microsoft C++ runtime, so Veraa runs on PCs without the VC++ redistributable.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64/Microsoft.VC143.CRT" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          Copy-Item "$crt/*.dll" $dist
          # Python for the Scripting menu: python312.dll, the standard library zip, extension
          # modules and the ._pth file that points Python at them.
          $ProgressPreference = "SilentlyContinue"
          $embed = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_EMBED_VERSION/python-$env:PYTHON_EMBED_VERSION-embed-amd64.zip" -OutFile $embed
          Expand-Archive $embed -DestinationPath $dist -Force
          Remove-Item "$dist/python.exe", "$dist/pythonw.exe" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$dist/python312.dll")) { throw "python312.dll missing from the package" }
          foreach ($dir in "scenes", "assets") { if (Test-Path $dir) { Copy-Item $dir $dist -Recurse } }
          Copy-Item README.md $dist
          if (Test-Path THIRD_PARTY_NOTICES.md) { Copy-Item THIRD_PARTY_NOTICES.md $dist }

      - name: Smoke-test the packaged renderer
        run: |
          $scene = Get-ChildItem dist/Veraa/scenes -Filter *.veraa -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($scene) {
            & dist/Veraa/veraa-render.exe $scene.FullName -o smoke.png --width 160 --height 90 --samples 4 --quiet
            if ($LASTEXITCODE -ne 0) { throw "veraa-render failed with exit code $LASTEXITCODE" }
            if (-not (Test-Path smoke.png)) { throw "veraa-render did not write an image" }
          }

      - name: Zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/Veraa -DestinationPath Veraa-windows-x64.zip

      # The finished app goes into the repository's App folder, so downloading the repository
      # gives a runnable Veraa.exe. Pushes made with the workflow token don't start new runs.
      - name: Put the app in the App folder of the repository
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf App
          cp -r dist/Veraa App
          # GitHub rejects files over 100 MB.
          big=$(find App -type f -size +95M)
          if [ -n "$big" ]; then echo "Too large to commit: $big"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A App
          if git diff --cached --quiet; then echo "App folder is already up to date"; exit 0; fi
          git commit -q -m "Update App folder with the Windows build of ${GITHUB_SHA:0:7} [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
            git pull -q --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      # The app's own UI self-test, on Windows with software OpenGL. Informational: it runs
      # after the App folder is updated and doesn't fail the build.
      - name: Self-test the app on Windows
        if: steps.package.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $env:QT_OPENGL = "software"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $cdb = "${env:ProgramFiles(x86)}/Windows Kits/10/Debuggers/x64/cdb.exe"
          if (Test-Path $cdb) {
            # Under the console debugger: a crash prints the call stack (symbols from the build).
            @(
              'sxd -c2 ".ecxr; kn 80; q" av'
              'sxe -c "kn 80; q" c0000409'
              'sxe -c "kn 80; q" c00000fd'
              'g'
              'q'
            ) | Set-Content cdb-commands.txt
            & $cdb -G -lines -y "build/bin/Release" -cf cdb-commands.txt dist/Veraa/Veraa.exe --script selftest *>&1 |
              Tee-Object selftest.log | Out-Null
          } else {
            $p = Start-Process -FilePath dist/Veraa/Veraa.exe -ArgumentList "--script", "selftest" -Wait -PassThru `
              -NoNewWindow -RedirectStandardOutput selftest.log -RedirectStandardError selftest.err
          }
          $log = Get-Content selftest.log
          $log | Select-String -Pattern 'FAIL|failure\(s\)|Access violation|Security check|Veraa!' |
            ForEach-Object { $_.Line }
          "---- last lines ----"
          $log | Select-Object -Last 120
          if (-not ($log -match "^0 failure\(s\)")) { throw "The self-test did not pass" }

      - name: Publish the version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Veraa-windows-x64.zip

      - name: Delete old build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done

      - name: Fail the build if unit tests failed
        if: steps.test.outcome == 'failure'
        run: throw "Unit tests failed (see the Test step)"

  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev libembree-dev libgl-dev python3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
